<!doctype html><html><head><meta charset='utf-8'><link rel="stylesheet" href="../../ferramentas/marca.css">
<style>
.opc{display:flex;flex-direction:column;gap:24px}
.opc .card{display:flex;align-items:center;gap:32px;padding:32px 40px;background:rgba(19,19,19,.72)}
.letra{font-size:44px;font-weight:700;color:var(--sky);width:40px;flex:none}
.txt{font-size:38px;line-height:1.25;color:var(--ink)}
</style></head><body>
<!-- Story 18/11/2026 18:00 · isso ou aquilo · página de agendamento · site institucional · família foto -->
<section class="story">
  <img class="foto" src="foto-1.jpg" style="object-position:45% 40%"><div class="tinta"></div><div class="veu-forte"></div><div style="position:absolute;inset:0;background:rgba(19,19,19,.3)"></div>
  <div class="head" style="top:250px"><span class="mark">BIFROST.</span><span class="eb">Isso ou aquilo?</span></div>
  <div style="position:absolute;left:var(--mx);right:var(--mx);top:700px">
    <div class="eb" style="margin-bottom:28px">Site institucional · agendamento</div>
    <h1 class="tmd" style="font-size:86px">Como o seu cliente <em>marca horário?</em></h1>
    <div class="opc" style="margin-top:48px">
      <div class="card"><span class="letra">A</span><span class="txt">Manda mensagem e espera alguém responder</span></div>
      <div class="card"><span class="letra">B</span><span class="txt">Abre um link e marca sozinho</span></div>
    </div>
    <p class="body" style="margin-top:36px;font-size:38px">Responde A ou B no direct.</p>
    <div style="margin-top:26px"><span class="cta solid">Post novo no feed →</span></div>
  </div>
</section>
</body></html>
