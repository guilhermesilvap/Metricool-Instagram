<!doctype html><html><head><meta charset='utf-8'><link rel="stylesheet" href="../../ferramentas/marca.css"></head><body>
<!-- Post único 21/10/2026 10:00 · Educação · Site institucional x landing page -->
<section class="slide">
<div class="ring" style="width:620px;height:620px;left:740px;top:-310px"></div>
<div class="orb" style="width:440px;height:440px;left:800px;top:-200px"></div>
<div class="head"><span class="mark">BIFROST.</span></div>

<div style="position:absolute;left:var(--mx);right:var(--mx);top:320px">
  <h1 class="tmd" style="font-size:96px">Site ou landing page? <em>Qual você precisa?</em></h1>
</div>

<!-- mockups -->
<div style="position:absolute;left:var(--mx);right:var(--mx);top:665px;display:flex;justify-content:space-between;align-items:flex-start">
  <!-- site institucional: navegador com menu de várias páginas -->
  <div style="width:520px">
    <div class="card" style="height:400px;padding:0;overflow:hidden">
      <div style="height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 20px">
        <span style="width:12px;height:12px;border-radius:50%;background:var(--line)"></span><span style="width:12px;height:12px;border-radius:50%;background:var(--line)"></span><span style="width:12px;height:12px;border-radius:50%;background:var(--line)"></span>
        <span style="margin-left:14px;font-size:18px;color:var(--ink-muted)">suaempresa.com.br</span>
      </div>
      <div style="padding:24px 26px">
        <div style="display:flex;gap:12px;justify-content:flex-end"><div style="width:58px;height:12px;background:var(--surface-2);border-radius:6px"></div><div style="width:58px;height:12px;background:var(--surface-2);border-radius:6px"></div><div style="width:58px;height:12px;background:var(--surface-2);border-radius:6px"></div><div style="width:58px;height:12px;background:var(--surface-2);border-radius:6px"></div></div>
        <div style="margin-top:30px;width:300px;height:22px;background:var(--ink);border-radius:6px"></div>
        <div style="margin-top:12px;width:220px;height:22px;background:var(--ink);border-radius:6px"></div>
        <div style="margin-top:28px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px">
          <div style="height:150px;background:var(--surface-2);border-radius:10px"></div><div style="height:150px;background:var(--surface-2);border-radius:10px"></div><div style="height:150px;background:var(--surface-2);border-radius:10px"></div>
        </div>
      </div>
    </div>
    <div class="eb" style="margin-top:30px">Site institucional</div>
    <p style="margin:10px 0 0;font-size:34px;line-height:1.2;color:var(--ink-soft)">Apresenta sua empresa</p>
  </div>
  <!-- landing page: celular com uma página e um botão -->
  <div style="width:300px">
    <div style="height:400px;background:var(--ink);border-radius:40px;padding:14px;box-shadow:0 30px 60px rgba(0,0,0,.5)">
      <div style="height:100%;background:#f7f6f3;border-radius:28px;padding:30px 22px;display:flex;flex-direction:column">
        <div style="width:150px;height:16px;background:#131313;border-radius:5px"></div>
        <div style="margin-top:10px;width:110px;height:16px;background:#131313;border-radius:5px"></div>
        <div style="margin-top:20px;width:190px;height:10px;background:#cfcdc8;border-radius:5px"></div>
        <div style="margin-top:8px;width:160px;height:10px;background:#cfcdc8;border-radius:5px"></div>
        <div style="margin-top:auto;background:var(--blue);color:#fff;border-radius:12px;padding:16px 0;text-align:center;font-size:18px;font-weight:700">Quero um orçamento</div>
      </div>
    </div>
    <div class="eb" style="margin-top:30px">Landing page</div>
    <p style="margin:10px 0 0;font-size:34px;line-height:1.2;color:var(--ink-soft)">Converte o anúncio</p>
  </div>
</div>

<div class="foot"><span class="eb muted">@bifrosttech</span><span class="eb">Fale conosco →</span></div>
</section>
</body></html>
